<svg viewBox="0 0 1300 900" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Iowan Old Style', serif">
  <rect x="0" y="0" width="1300" height="900" fill="#0a0908"/>

  <text x="30" y="52" font-size="24" fill="#d4b062">&#10022;</text>
  <text x="1270" y="52" font-size="24" fill="#d4b062" text-anchor="end">&#10022;</text>
  <text x="650" y="66" font-size="42" letter-spacing="4" fill="#d4b062" text-anchor="middle">THE MAGICIAN&#8217;S LEDGER</text>
  <text x="650" y="102" font-size="18" font-style="italic" fill="#a89880" text-anchor="middle">a private catalogue of effects &amp; mysteries</text>

  <line x1="0" y1="150" x2="1300" y2="150" stroke="#2a2520" stroke-width="1"/>

  <!-- stats row -->
  <g text-anchor="middle" fill="#a89880" font-size="13" letter-spacing="2">
    <text x="130" y="188">EFFECTS</text>
    <text x="390" y="188">TOTAL INVESTED</text>
    <text x="650" y="188">CURRENT WORTH</text>
    <text x="910" y="188">PERFORMANCE READY</text>
    <text x="1170" y="188">LATEST ACQUISITION</text>
  </g>
  <g text-anchor="middle" fill="#d4b062" font-size="30">
    <text x="130" y="232">12</text>
    <text x="390" y="232">$284.00</text>
    <text x="650" y="232">$310.00</text>
    <text x="910" y="232">5</text>
    <text x="1170" y="232">Invisible Deck</text>
  </g>

  <line x1="0" y1="260" x2="1300" y2="260" stroke="#2a2520" stroke-width="1"/>

  <!-- search -->
  <rect x="40" y="285" width="600" height="42" rx="3" fill="#141210" stroke="#2a2520"/>
  <text x="58" y="312" font-size="16" fill="#6b5f4a">Search the ledger&#8230;</text>

  <!-- dropdown rows -->
  <g fill="#141210" stroke="#2a2520">
    <rect x="40" y="345" width="1220" height="40" rx="3"/>
    <rect x="40" y="395" width="1220" height="40" rx="3"/>
    <rect x="40" y="445" width="1220" height="40" rx="3"/>
  </g>
  <g fill="#e8dfc9" font-size="16">
    <text x="58" y="370">All effects</text>
    <text x="58" y="420">Sort: Name</text>
    <text x="58" y="470">50 per page</text>
  </g>
  <g fill="#6b5f4a" font-size="14" text-anchor="end">
    <text x="1240" y="370">&#9662;</text>
    <text x="1240" y="420">&#9662;</text>
    <text x="1240" y="470">&#9662;</text>
  </g>

  <!-- view toggle + actions -->
  <rect x="40" y="505" width="105" height="40" rx="3" fill="none" stroke="#2a2520"/>
  <text x="92" y="530" font-size="15" fill="#a89880" text-anchor="middle" letter-spacing="1">CARDS</text>
  <rect x="155" y="505" width="105" height="40" rx="3" fill="#b08d3e"/>
  <text x="207" y="530" font-size="15" fill="#0a0908" text-anchor="middle" letter-spacing="1">TABLE</text>

  <rect x="650" y="505" width="150" height="40" rx="3" fill="#b08d3e"/>
  <text x="725" y="530" font-size="14" fill="#0a0908" text-anchor="middle" letter-spacing="1">+ ADD EFFECT</text>
  <rect x="815" y="505" width="140" height="40" rx="3" fill="none" stroke="#3d362d"/>
  <text x="885" y="530" font-size="13" fill="#a89880" text-anchor="middle" letter-spacing="1">EXPORT JSON</text>
  <rect x="970" y="505" width="80" height="40" rx="3" fill="none" stroke="#3d362d"/>
  <text x="1010" y="530" font-size="13" fill="#a89880" text-anchor="middle" letter-spacing="1">CSV</text>
  <rect x="1065" y="505" width="100" height="40" rx="3" fill="none" stroke="#3d362d"/>
  <text x="1115" y="530" font-size="13" fill="#a89880" text-anchor="middle" letter-spacing="1">IMPORT</text>
  <rect x="1180" y="505" width="80" height="40" rx="3" fill="none" stroke="#3d362d"/>
  <text x="1220" y="530" font-size="13" fill="#a89880" text-anchor="middle" letter-spacing="1">PRINT</text>

  <!-- filter chips -->
  <g font-size="14" letter-spacing="0.5">
    <rect x="40" y="565" width="62" height="34" rx="17" fill="#b08d3e"/>
    <text x="71" y="587" fill="#0a0908" text-anchor="middle">All</text>

    <rect x="112" y="565" width="112" height="34" rx="17" fill="none" stroke="#3d362d"/>
    <text x="168" y="587" fill="#a89880" text-anchor="middle">&#9733; Starred</text>

    <rect x="234" y="565" width="72" height="34" rx="17" fill="none" stroke="#3d362d"/>
    <text x="270" y="587" fill="#a89880" text-anchor="middle">EDC</text>

    <rect x="316" y="565" width="190" height="34" rx="17" fill="none" stroke="#3d362d"/>
    <text x="411" y="587" fill="#a89880" text-anchor="middle">Performance Ready</text>

    <rect x="516" y="565" width="170" height="34" rx="17" fill="none" stroke="#3d362d"/>
    <text x="601" y="587" fill="#a89880" text-anchor="middle">Needs Practice</text>

    <rect x="696" y="565" width="160" height="34" rx="17" fill="none" stroke="#3d362d"/>
    <text x="776" y="587" fill="#a89880" text-anchor="middle">Bottom Drawer</text>
  </g>

  <!-- table -->
  <rect x="30" y="625" width="1240" height="36" fill="#141210"/>
  <g font-size="12" fill="#b08d3e" letter-spacing="1.5">
    <text x="60" y="648">&#9733;</text>
    <text x="110" y="648">NAME</text>
    <text x="560" y="648">CREATOR</text>
    <text x="720" y="648">TYPE</text>
    <text x="810" y="648">STATUS</text>
    <text x="975" y="648">DIFFICULTY</text>
    <text x="1105" y="648">PAID</text>
    <text x="1185" y="648">LOCATION</text>
  </g>
  <line x1="30" y1="661" x2="1270" y2="661" stroke="#2a2520"/>

  <!-- row 1 -->
  <rect x="70" y="672" width="46" height="46" rx="4" fill="#6e5825"/>
  <text x="130" y="702" font-size="19" fill="#e8dfc9">Sponge Bunnies</text>
  <text x="560" y="702" font-size="15" fill="#a89880">Classic</text>
  <text x="720" y="702" font-size="15" fill="#e8dfc9">Cards</text>
  <rect x="800" y="685" width="150" height="28" rx="14" fill="rgba(107,156,94,0.16)" stroke="#6b9c5e"/>
  <text x="875" y="704" font-size="13" fill="#6b9c5e" text-anchor="middle">Performance Ready</text>
  <text x="975" y="702" font-size="15" fill="#e8dfc9">Beginner</text>
  <text x="1105" y="702" font-size="15" fill="#e8dfc9">$12.00</text>
  <text x="1185" y="702" font-size="15" fill="#a89880">EDC</text>
  <line x1="30" y1="736" x2="1270" y2="736" stroke="#2a2520"/>

  <!-- row 2 -->
  <rect x="70" y="747" width="46" height="46" rx="4" fill="#6e5825"/>
  <text x="130" y="777" font-size="19" fill="#e8dfc9">Invisible Deck</text>
  <text x="560" y="777" font-size="15" fill="#a89880">U.F. Grant</text>
  <text x="720" y="777" font-size="15" fill="#e8dfc9">Cards</text>
  <rect x="800" y="760" width="150" height="28" rx="14" fill="rgba(200,148,70,0.16)" stroke="#c89446"/>
  <text x="875" y="779" font-size="13" fill="#c89446" text-anchor="middle">Needs Practice</text>
  <text x="975" y="777" font-size="15" fill="#e8dfc9">Intermediate</text>
  <text x="1105" y="777" font-size="15" fill="#e8dfc9">$9.00</text>
  <text x="1185" y="777" font-size="14" fill="#a89880">Bottom Drawer</text>
  <line x1="30" y1="811" x2="1270" y2="811" stroke="#2a2520"/>

  <!-- row 3 -->
  <rect x="70" y="822" width="46" height="46" rx="4" fill="#6e5825"/>
  <text x="130" y="852" font-size="19" fill="#e8dfc9">Linking Rings</text>
  <text x="560" y="852" font-size="15" fill="#a89880">Classic</text>
  <text x="720" y="852" font-size="15" fill="#e8dfc9">Stage</text>
  <rect x="800" y="835" width="150" height="28" rx="14" fill="rgba(107,156,94,0.16)" stroke="#6b9c5e"/>
  <text x="875" y="854" font-size="13" fill="#6b9c5e" text-anchor="middle">Performance Ready</text>
  <text x="975" y="852" font-size="15" fill="#e8dfc9">Advanced</text>
  <text x="1105" y="852" font-size="15" fill="#e8dfc9">$45.00</text>
  <text x="1185" y="852" font-size="15" fill="#a89880">Case</text>
  <line x1="30" y1="886" x2="1270" y2="886" stroke="#2a2520"/>
</svg>
